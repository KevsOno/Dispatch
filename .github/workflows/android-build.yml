name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      # Core App Secrets
      VITE_SUPABASE_URL:        ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:   ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_GEOCODER:            ${{ vars.VITE_GEOCODER }}

      # Geocoding & Mapping Providers (Legacy / Fallbacks)
      VITE_MAPBOX_TOKEN:        ${{ secrets.VITE_MAPBOX_TOKEN }}
      VITE_LOCATIONIQ_KEY:      ${{ secrets.VITE_LOCATIONIQ_KEY }}

      # Amazon Location Service (New)
      VITE_AWS_REGION:          ${{ vars.VITE_AWS_REGION || 'eu-west-1' }}
      VITE_AWS_LOCATION_MAP:    ${{ vars.VITE_AWS_LOCATION_MAP || 'logiflow-map' }}
      VITE_AWS_LOCATION_PLACES: ${{ vars.VITE_AWS_LOCATION_PLACES || 'logiflow-places' }}
      VITE_AWS_LOCATION_ROUTES: ${{ vars.VITE_AWS_LOCATION_ROUTES || 'logiflow-routes' }}
      VITE_AWS_LOCATION_API_KEY: ${{ secrets.VITE_AWS_LOCATION_API_KEY }}

      # Android Signing
      ANDROID_KEYSTORE_BASE64:  ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm install

      - name: Configure Capacitor Hostname for AWS API Key
        run: |
          node -e '
            const fs = require("fs");
            const file = "capacitor.config.json";
            let config = {};
            if (fs.existsSync(file)) {
              config = JSON.parse(fs.readFileSync(file, "utf8"));
            }
            config.server = config.server || {};
            config.server.hostname = "dispflow.netlify.app";
            config.server.androidScheme = "https";
            config.server.iosScheme = "https";
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          '

      - name: Build web app
        run: npm run build

      - name: Ensure Android platform exists
        run: |
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_PATH:     release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ! grep -q "signingConfigs" app/build.gradle.kts; then
            python3 - <<'PY'
          import pathlib
          p = pathlib.Path("app/build.gradle.kts")
          s = p.read_text()
          signing = '''
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          '''
          s = s.replace("android {", signing, 1)
          p.write_text(s)
          PY
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
